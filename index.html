<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1F3864">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Training Logger</title>
<style>
:root{--navy:#1F3864;--blue:#2E75B6;--bg:#0f141b;--card:#1a212c;--card2:#222b39;--line:#2f3a4a;--txt:#e8edf4;--mut:#93a1b3;--gold:#e0a800;--good:#3ea76a;--bad:#e05a4a;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom,0));}
body.timer-on{padding-bottom:calc(160px + env(safe-area-inset-bottom,0));}
/* 2026-11-08: hide both bottom bars while typing, so the iPhone keyboard cannot drag them over the input */
body.typing .tabbar,body.typing .timerbar{display:none !important;}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#1F3864,#16223a);padding:14px 16px 12px;padding-top:calc(14px + env(safe-area-inset-top,0));box-shadow:0 2px 10px rgba(0,0,0,.4);}
header .t{font-size:19px;font-weight:800;letter-spacing:.2px;}
header .s{font-size:12px;color:#b9c6da;margin-top:2px;}
.wrap{padding:14px 14px 20px;max-width:640px;margin:0 auto;}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:700;color:#fff;background:var(--blue);margin:10px 0;text-align:center;cursor:pointer;}
.btn.sec{background:var(--card2);border:1px solid var(--line);}
.btn.gold{background:var(--gold);color:#20180a;}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt);}
.btn.sm{padding:11px;font-size:14px;}
.pick{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px;}
.chip{flex:1;min-width:56px;text-align:center;padding:14px 6px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:15px;color:var(--txt);cursor:pointer;}
.chip.on{background:var(--blue);border-color:var(--blue);}
.lbl{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin:16px 2px 4px;}
.sec-h{font-size:12px;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:1px;margin:18px 4px 6px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;}
.exn{font-size:16px;font-weight:800;}
.tgt{font-size:12.5px;color:var(--blue);font-weight:700;margin-top:2px;}
.cue{font-size:12.5px;color:#c3cfdd;margin-top:8px;line-height:1.6;background:#141b25;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:9px;padding:10px 11px;}
.tools{display:flex;gap:7px;margin-top:9px;}
.tool{flex:1;text-align:center;font-size:12px;font-weight:700;padding:9px 6px;border-radius:9px;background:var(--card2);border:1px solid var(--line);color:var(--txt);text-decoration:none;cursor:pointer;display:block;}
.tool.on{background:var(--blue);border-color:var(--blue);color:#fff;}
.meta{font-size:12px;color:var(--mut);margin-top:5px;line-height:1.5;}
.meta b{color:var(--txt);}
.setrow{display:flex;align-items:center;gap:7px;margin-top:8px;}
.setrow .n{width:20px;color:var(--mut);font-size:13px;font-weight:700;text-align:center;}
.setrow input{flex:1;min-width:0;background:#0e141d;border:1px solid var(--line);border-radius:10px;color:#fff;font-size:16px;padding:11px 6px;text-align:center;-moz-appearance:textfield;}
.setrow input::-webkit-outer-spin-button,.setrow input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.caps{display:flex;gap:7px;margin:6px 0 0 27px;}
.caps span{flex:1;text-align:center;font-size:9.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;}
.addset{background:transparent;border:1px dashed var(--line);color:var(--mut);border-radius:10px;padding:8px;width:100%;margin-top:8px;font-size:13px;cursor:pointer;}
.delset{flex:0 0 34px;width:34px;background:transparent;border:1px solid var(--line);color:var(--mut);border-radius:10px;font-size:19px;line-height:1;padding:9px 0;cursor:pointer;font-family:inherit;}
.delset:active{background:var(--bad);border-color:var(--bad);color:#fff;}
.done{display:flex;align-items:center;gap:10px;margin-top:8px;}
.done input{width:26px;height:26px;}
textarea{width:100%;background:#0e141d;border:1px solid var(--line);border-radius:10px;color:#fff;font-size:15px;padding:10px;margin-top:6px;font-family:inherit;}
.est{font-size:12px;color:var(--good);font-weight:700;margin-top:6px;}
.tabbar{position:fixed;bottom:0;left:0;right:0;display:flex;background:#121924;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0);z-index:30;}
.tabbar button{flex:1;background:none;border:0;color:var(--mut);font-size:11px;padding:10px 4px;font-weight:700;cursor:pointer;}
.tabbar button.on{color:var(--blue);}
.tabbar .ic{font-size:19px;display:block;}
.hist{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;cursor:pointer;}
.hist.open{border-color:var(--gold);}
.hist .d{font-weight:800;}
.hist .m{font-size:12px;color:var(--mut);margin-top:3px;}
.badge{display:inline-block;font-size:10px;font-weight:800;padding:2px 7px;border-radius:20px;background:var(--gold);color:#20180a;margin-left:6px;vertical-align:1px;}
.timerbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0));background:#141c28;border-top:1px solid var(--line);padding:8px 12px;display:none;align-items:center;gap:10px;z-index:25;}
.timerbar.on{display:flex;}
.timerbar .tm{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;min-width:64px;}
.timerbar button{background:var(--card2);border:1px solid var(--line);color:#fff;border-radius:9px;padding:8px 12px;font-weight:700;font-size:13px;}
.note{font-size:12px;color:var(--mut);background:rgba(224,168,0,.08);border:1px solid rgba(224,168,0,.35);border-radius:10px;padding:10px;margin:10px 0;line-height:1.5;}
.warn{font-size:12.5px;color:#ffd9d3;background:rgba(224,90,74,.12);border:1px solid rgba(224,90,74,.5);border-radius:10px;padding:10px;margin:10px 0;line-height:1.5;}
.ok{font-size:12px;color:#cfe9da;background:rgba(62,167,106,.10);border:1px solid rgba(62,167,106,.4);border-radius:10px;padding:10px;margin:10px 0;line-height:1.5;}
h2.scr{font-size:20px;margin:6px 2px 2px;}
.mut{color:var(--mut);font-size:13px;line-height:1.55;}
.savedot{font-size:11px;color:var(--good);margin-top:3px;}
#updbar{position:fixed;left:0;right:0;top:0;z-index:60;background:var(--gold);color:#20180a;font-weight:800;font-size:14px;padding:14px;text-align:center;display:none;cursor:pointer;}
#updbar.on{display:block;}
.okset{flex:0 0 34px;width:34px;background:transparent;border:1px solid var(--good);color:var(--good);border-radius:10px;font-size:16px;line-height:1;padding:10px 0;cursor:pointer;font-family:inherit;}
.okset:active{background:var(--good);color:#fff;}
.setrow input::placeholder{color:#5d6b7e;}
.upnext{background:linear-gradient(135deg,#1F3864,#2E75B6);border-radius:16px;padding:16px;margin:6px 0 12px;}
.upnext .k{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#cfe0f5;font-weight:800;}
.upnext .d{font-size:21px;font-weight:800;margin:4px 0 2px;}
.upnext .m{font-size:13px;color:#dbe7f6;}
.wkrow{display:flex;gap:8px;margin:10px 0 2px;}
.wkrow div{flex:1;text-align:center;padding:9px 4px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--mut);}
.wkrow div.ok{background:rgba(62,167,106,.18);border-color:var(--good);color:#cfe9da;}
.timerbar.ring{background:#3a2a05;border-top-color:var(--gold);}
</style>
</head>
<body>
<header><div class="t" id="hdrT">Training Logger</div><div class="s" id="hdrS">Block 4 · tap Log to begin</div><div class="savedot" id="buildTag" style="color:#93a1b3"></div><div class="savedot" id="saveDot"></div></header>
<div id="updbar" onclick="doUpdate()">A newer version is available — tap here to load it</div>
<div class="wrap" id="app"></div>

<div class="timerbar" id="tbar"><div class="tm" id="tm">2:00</div><button onclick="tAdj(-15)">−15</button><button onclick="tAdj(15)">+15</button><button onclick="tToggle()" id="tBtn">Start</button><button onclick="tHide()">✕</button></div>

<div class="tabbar">
<button id="tab-log" class="on" onclick="go('log')"><span class="ic">➕</span>Log</button>
<button id="tab-hist" onclick="go('hist')"><span class="ic">📖</span>History</button>
<button id="tab-data" onclick="go('data')"><span class="ic">📤</span>Send</button>
<button id="tab-info" onclick="go('info')"><span class="ic">ℹ️</span>Guide</button>
</div>

<script>
"use strict";
var BUILD="2026-11-16-f";

/* =========================================================
   FIELD TYPES — every input is explicitly declared per exercise.
   No exercise ever gets a box that does not belong to it.
   ========================================================= */
var FT={
 load  :{cap:"Load lb",   ph:"lb"},
 loadh :{cap:"Load /hand",ph:"lb/hand"},
 assist:{cap:"Assist lb", ph:"assist"},
 ball  :{cap:"Ball lb",   ph:"ball"},
 pin   :{cap:"Stack/pin", ph:"pin"},
 reps  :{cap:"Reps",      ph:"reps"},
 rside :{cap:"Reps /side",ph:"/side"},
 rleg  :{cap:"Reps /leg", ph:"/leg"},
 rir   :{cap:"RIR",       ph:"rir"},
 distm :{cap:"Distance m",ph:"metres"},
 distin:{cap:"Distance in",ph:"inches"},
 hgtin :{cap:"Height in", ph:"inches"},
 sec   :{cap:"Seconds",   ph:"sec"},
 min   :{cap:"Minutes",   ph:"min"},
 hr    :{cap:"Avg HR",    ph:"bpm"},
 rpe   :{cap:"RPE",       ph:"rpe"},
 watts :{cap:"Avg watts", ph:"watts"},
 rounds:{cap:"Rounds",    ph:"rounds"},
 ivals :{cap:"Intervals", ph:"how many"},
 lval  :{cap:"Left",      ph:"left"},
 rval  :{cap:"Right",     ph:"right"}
};
/* field keys that mean "a load" for est-1RM purposes */
var LOADK=["load","loadh"];

/* =========================================================
   PROGRAM — Block 4 v3 (generated from block4.py, 2026-11-16-f)
   f: field keys. wk: load per week [W1..W4]; "+5%" etc. is computed from your last log.
   rp: target reps (placeholder). rir: target RIR per week. rest: seconds for the rest timer.
   ========================================================= */
var BLOCKNUM=4;
var BLOCK="Block 4";
var NWEEKS=4;
var ORDER=["A","B","C"];
var WEEKTIP={"1": "W1 (Nov 23–29) — RE-ENTRY + TESTS. Every lift at 3 RIR. Tue: left/right screen replaces Pair C. Sun: change-of-direction baseline replaces agility round 3, and the back-extension hold goes last. Learn the leg press, hip thrust, inner-thigh machine and Cossack squat.", "2": "W2 (Nov 30 – Dec 6) — BUILD. The ★ lift at 1–2 RIR. Friday machine lifts (leg press, leg curl, seated calf) at 2. Everything else at 2–3. Random-beep drop-steps start in the agility circuit.", "3": "W3 (Dec 7–13) — PEAK. Top loads. The ★ lift at 1–2 RIR. Friday machine lifts at 1 rep left. Sunday: nothing below 2 (tennis Monday). Agility at 85–90%, never max. Loaded trunk work stays at 2+ RIR.", "4": "W4 (Dec 14–20) — DELOAD + RETEST. ~60–65% loads, about half the sets, 4 RIR. Fri (Day B): broad jump + vertical (same app). Sun: change of direction + back-extension hold. Then Block 5 (leg strength) starts Mon Dec 21."};
var LOADRULE="LOAD RULE \u2014 beat the top of the rep range by 2+ \u2192 add ~5% next time. Miss the bottom by 2+ \u2192 drop ~10%. Inside the range at the target RIR \u2192 repeat the load. Grey numbers in each row are this week\u2019s target: tap \u2713 to log the set exactly as shown, or type what you actually did.";
var RIRRULE="RIR RULE \u2014 one lift a day (marked \u2605) goes to 1\u20132 RIR from week 2. Friday machine lifts (leg press, leg curl, seated calf): 2 in week 2, 1 in week 3. Everything else at 2\u20133. Sunday: nothing below 2, tennis is Monday. Week 1 is 3 RIR on everything; week 4 is 4 RIR. Loaded trunk work never below 2 RIR, and exhale every rep.";
var PAIRRULE="PAIR RULE \u2014 A1/A2, B1/B2, C1/C2 are supersets: A1 \u2192 ~40 s \u2192 A2 \u2192 ~70 s \u2192 back to A1. Never pair the jumps, the med-ball throw, the front squat or the trap bar \u2014 full rest. Tap \u23f1 on any exercise for its rest timer.";

var PROGRAM={"A": {"name": "Day A — Upper maintenance + shoulder + trunk", "label": "Day A", "short": "Tue · upper maintenance + shoulder · ~60 min", "items": [{"s": "Warm-up", "id": "b_z2", "n": "Zone 2 bike — warm-up", "f": ["min", "hr"], "tg": "10 min · nose-breathing pace", "cue": "ZONE 2 IS THE WARM-UP. Bike, nose-breathing, full sentences the whole time — that is the zone. Heart rate is the backup only: stay under ~136. Log minutes and average HR. Nothing else is required.", "sets": 1, "q": "zone 2 cycling easy pace"}, {"s": "Warm-up", "id": "b_prep", "n": "Shoulder prep", "f": ["done"], "tg": "6 min", "cue": "Shoulder CARs · band pull-aparts 2 × 15 · face pull 2 × 15 · band external rotation 2 × 12/side · prone Y-raise 2 × 10 · T-spine open-book 5/side.", "q": "shoulder warm up band pull apart face pull external rotation"}, {"s": "W1 only — testing", "id": "b_screen", "n": "Left/right screen (W1 ONLY)", "f": ["lval", "rval"], "tg": "W1 only · 10 min · replaces Pair C this week", "cue": "One row per test, LEFT then RIGHT. Row 1 ankle knee-to-wall (cm from the wall). Rows 2–5 score 0 = restricted or painful, 1 = limited, 2 = full: 2 hip internal rotation (seated) · 3 hip external rotation (seated) · 4 shoulder external rotation (lying, elbow at 90°) · 5 T-spine rotation (seated, arms crossed). Write anything odd in the notes.", "sets": 5, "q": "hip internal rotation test seated"}, {"s": "Power — full rest, never paired", "id": "b_mb", "n": "Rotational med-ball throw", "f": ["ball", "rside"], "tg": "3 × 4 /side · {L} lb ball", "cue": "Fast hips, not arm. Swing power comes from the hips and trunk — this keeps it. Ball goes to 10 lb in W3 only if W2 is still visibly fast.", "sets": 3, "wk": [8, 8, 10, 8], "rp": "4", "rest": 90, "q": "rotational med-ball throw"}, {"s": "Pair A — superset", "id": "b_pull", "n": "A1 — Assisted pull-up", "f": ["assist", "reps", "rir"], "tg": "3 × 6–8 · {L} lb ASSIST", "cue": "Log the ASSIST — lower is stronger. Block 3 took it 55 → 48.75. Target this block: 45 by W3. Neutral grip if your machine has it.", "sets": 3, "wk": [50, 47.5, 45, 60], "rp": "8", "rir": [3, 2, 2, 4], "rest": 70, "v": "https://www.youtube.com/watch?v=gx0RWT7WbmA"}, {"s": "Pair A — superset", "id": "b_mpress", "n": "A2 — Machine chest press, NEUTRAL grip ★ the 1–2 RIR lift", "f": ["load", "reps", "rir"], "tg": "3 × 8 (W3: 3 × 6–8) · {L} lb", "cue": "The day's one lift near failure from W2. Neutral handles, fixed path — this is the version that has stayed pain-free since October. Any front-of-shoulder pinch: stop and tick the arm box.", "sets": 3, "wk": [155, 165, 170, 125], "rp": "8", "rir": [3, 2, 1.5, 4], "rest": 70, "q": "machine chest press, neutral grip ★ the 1–2 rir lift"}, {"s": "Pair B — superset", "id": "b_row", "n": "B1 — Chest-supported T-bar row", "f": ["load", "reps", "rir"], "tg": "3 × 10 · {L} lb TOTAL", "cue": "Neutral handle. Straps if grip fades first.", "sets": 3, "wk": [60, 65, 70, 45], "rp": "10", "rir": [3, 2, 2, 4], "rest": 70, "q": "chest-supported t-bar row"}, {"s": "Pair B — superset", "id": "b_minc", "n": "B2 — Incline machine press, NEUTRAL grip", "f": ["load", "reps", "rir"], "tg": "3 × 10 · {L} lb", "cue": "Same machine every week so the numbers compare. Any pinch: stop and finish on the flat machine press.", "sets": 3, "wk": [140, 150, 155, 110], "rp": "10", "rir": [3, 2, 2, 4], "rest": 70, "q": "incline machine press, neutral grip"}, {"s": "Pair C — superset (skip in W1: screen instead)", "id": "b_cuff", "n": "C1 — Shoulder external rotation (cable or band) (NEW)", "f": ["load", "rside", "rir"], "tg": "2 × 12–15 /side · {L}", "cue": "Elbow at your side on a small towel, rotate out slowly, 2 seconds back. Light on purpose: pick a load you could do 20 times and stop at 12–15. This is shoulder insurance, not strength work.", "sets": 2, "wk": ["FIND", "+5%", "+5%", "-30%"], "rp": "12", "rir": [3, 3, 3, 4], "rest": 40, "q": "cable external rotation rotator cuff"}, {"s": "Pair C — superset (skip in function topLoad(e){
 var best=0;(e&&e.sets||[]).forEach(function(st){LOADK.concat(["pin"]).forEach(function(k){var v=parseFloat(st[k]);if(v>best)best=v;});});
 return best;

function r25(x){return Math.round(x/2.5)*2.5;}
/* A load the program states as a rule ("+5%", "-30%", "FIND") becomes a real number here,
   from the last time you logged that exercise. */
function loadFor(it,week,sid){
 if(!it.wk||!week)return null;
 var L=it.wk[week-1];
 if(L===""||L==null)return null;
 if(typeof L==="number")return L;
 var m=String(L).match(/^([+-])(\d+)%$/);
 if(m){var lf=lastFor(it.id,sid),base=lf?topLoad(lf.e):0;
  if(!base)return "FIND";
  var f=1+(m[1]==="+"?1:-1)*parseInt(m[2],10)/100;return r25(base*f);}
 return L;
}
function targetFor(it,week,sid){
 var t=it.tg||"",L=loadFor(it,week,sid);
 if(L==="FIND")t=t.replace("{L}","FIND (pick a load you\u2019d finish with ~3 reps left)");
 return t.replace("{L}",(L===""||L==null)?"\u2014":L);
}

/* =========================================================
   STORAGE — v2. Every session lives in ONE array from the
   moment it starts. Nothing depends on remembering to press
   Finish. Mirrored to a second key on every write.
   ========================================================= */
var KEY="aa_logger_v2", MIRROR="aa_logger_v2_mirror", SALVAGE="aa_logger_v2_salvage", OLDKEY="aa_logger_v1", TRASH="aa_logger_v2_trash";
var booted=false;
var DB={sessions:[],lastExport:null,ver:2};
var view="log", storageOK=true;

function nowISO(){return new Date().toISOString();}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function uid(){return "s"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

function readKey(k){try{var raw=localStorage.getItem(k);return raw?JSON.parse(raw):null;}catch(e){return null;}}

function boot(){
 var cands=[readKey(KEY),readKey(MIRROR),readKey(SALVAGE)].filter(function(x){return x&&x.sessions;});
 // whichever copy holds the most sessions wins — a half-written or emptied
 // key can never beat a good one
 cands.sort(function(x,y){return (y.sessions||[]).length-(x.sessions||[]).length;});
 if(cands.length)DB=cands[0];
 // migrate Block 1 data if we have nothing yet (runs even if an empty v2 store exists)
 if(!DB.sessions||!DB.sessions.length){
  var old=readKey(OLDKEY);
  if(old){
   DB.sessions=(old.sessions||[]).map(function(s){s.status="done";s.block=1;s.id=s.id||uid();return s;});
   // RECOVER an unfinished draft — this is exactly what was being lost before
   if(old.draft&&old.draft.entries&&Object.keys(old.draft.entries).length){
    var d=old.draft;d.status="open";d.block=1;d.id=uid();d.recovered=true;DB.sessions.push(d);
   }
  }
 }
 if(!DB.sessions)DB.sessions=[];
 DB.ver=2;
 booted=true;
 autoCloseStale();
 /* blank sessions in the current block are dropped at launch — they hold nothing */
 var nb=DB.sessions.length;
 DB.sessions=DB.sessions.filter(function(s){return !((s.block||2)===BLOCKNUM&&isBlank(s));});
 save(DB.sessions.length<nb);
}
/* Writing is guarded. A save can never silently replace a bigger store with a
   smaller one: any shrink is stashed to a salvage key first, and a save that
   would wipe the store back to zero is refused outright. */
function save(allowShrink){
 if(!booted)return;
 allowShrink=(allowShrink===true);   /* an Event object handed over by a listener must never count as permission to shrink */
 DB.updated=nowISO();
 var payload=JSON.stringify(DB);
 try{
  var prev=readKey(KEY);
  var prevN=prev&&prev.sessions?prev.sessions.length:0, curN=(DB.sessions||[]).length;
  if(prevN>curN){
   if(curN===0&&!allowShrink){            // pathological — refuse and reload the good copy
    DB=prev;storageOK=true;flashSaved();return;
   }
   payload=JSON.stringify(DB);
   if(allowShrink){
    /* a deliberate delete: keep the old copy in a key the app never loads from, and make the
       salvage copy match, so the next launch cannot bring the deleted session back */
    try{localStorage.setItem(TRASH,JSON.stringify(prev));}catch(e2){}
    try{localStorage.setItem(SALVAGE,payload);}catch(e3){}
   }else{
    try{localStorage.setItem(SALVAGE,JSON.stringify(prev));}catch(e2){}
   }
  }
  localStorage.setItem(KEY,payload);
  localStorage.setItem(MIRROR,payload);
  storageOK=true;
 }catch(e){storageOK=false;}
 flashSaved();
}

/* Any session left open for more than 18 hours is closed automatically.
   A forgotten session can no longer disappear from History or the export. */
function autoCloseStale(){
 var cut=Date.now()-18*3600*1000, changed=false;
 DB.sessions.forEach(function(s){
  if(s.status==="open"){
   var t=Date.parse(s.updated||s.started||"")||0;
   if(t&&t<cut){s.status="done";s.autoClosed=true;changed=true;}
  }
 });
 return changed;
}
function hasData(s){
 return Object.keys(s.entries||{}).some(function(k){
  var e=s.entries[k];if(!e)return false;
  if(e.done||e.txt)return true;
  return (e.sets||[]).some(function(st){return Object.keys(st).some(function(f){return st[f]!==""&&st[f]!=null;});});
 });
}
function openSessions(){return DB.sessions.filter(function(s){return s.status==="open";});}
function daysSinceExport(){if(!DB.lastExport)return null;return Math.floor((Date.now()-Date.parse(DB.lastExport))/86400000);}

/* ---------- HELPERS ---------- */
function el(h){var d=document.createElement("div");d.innerHTML=h;return d.firstElementChild;}
function esc(s){return(s==null?"":String(s)).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function e1rm(w,r,rir){w=parseFloat(w);r=parseFloat(r);var q=parseFloat(rir);if(!w||!r)return null;if(isNaN(q))q=0;return Math.round(w*(1+(r+q)/30));}
function stamp(s){return s.started||((s.date||"")+"T00:00:00.000Z");}
function lastFor(id,exceptId){
 var cur=DB.sessions.filter(function(x){return x.id===exceptId;})[0];
 var curT=cur?stamp(cur):"";
 for(var i=DB.sessions.length-1;i>=0;i--){
  var s=DB.sessions[i];if(s.id===exceptId)continue;
  if(curT&&stamp(s)>curT)continue;   // editing an old session must not quote a newer one
  var e=s.entries&&s.entries[id];
  if(e&&(e.sets||[]).some(function(st){return Object.keys(st).some(function(f){return st[f]!==""&&st[f]!=null;});}))return{sess:s,e:e};
 }
 return null;
}
function lastDoneFor(id,exceptId){
 var cur=DB.sessions.filter(function(x){return x.id===exceptId;})[0];
 var curT=cur?stamp(cur):"";
 for(var i=DB.sessions.length-1;i>=0;i--){
  var s=DB.sessions[i];if(s.id===exceptId)continue;
  if(curT&&stamp(s)>curT)continue;
  var e=s.entries&&s.entries[id];
  if(e&&(e.done||e.txt))return s;
 }
 return null;
}
function setStr(it,st){
 var f=it.f||[],out=[];
 if(f.indexOf("load")>=0&&st.load)out.push(st.load+" lb");
 if(f.indexOf("loadh")>=0&&st.loadh)out.push(st.loadh+" lb/hand");
 if(f.indexOf("assist")>=0&&st.assist)out.push(st.assist+" assist");
 if(f.indexOf("ball")>=0&&st.ball)out.push(st.ball+" lb ball");
 if(f.indexOf("pin")>=0&&st.pin)out.push("pin "+st.pin);
 if(f.indexOf("reps")>=0&&st.reps)out.push(st.reps+" reps");
 if(f.indexOf("rside")>=0&&st.rside)out.push(st.rside+"/side");
 if(f.indexOf("rleg")>=0&&st.rleg)out.push(st.rleg+"/leg");
 if(f.indexOf("distm")>=0&&st.distm)out.push(st.distm+" m");
 if(f.indexOf("distin")>=0&&st.distin)out.push(st.distin+" in");
 if(f.indexOf("hgtin")>=0&&st.hgtin)out.push(st.hgtin+" in");
 if(f.indexOf("sec")>=0&&st.sec)out.push(st.sec+" s");
 if(f.indexOf("min")>=0&&st.min)out.push(st.min+" min");
 if(f.indexOf("hr")>=0&&st.hr)out.push(st.hr+" bpm");
 if(f.indexOf("ivals")>=0&&st.ivals)out.push(st.ivals+" intervals");
 if(f.indexOf("rpe")>=0&&st.rpe)out.push("RPE "+st.rpe);
 if(f.indexOf("rounds")>=0&&st.rounds)out.push(st.rounds+" rounds");
 if(f.indexOf("rir")>=0&&st.rir!==""&&st.rir!=null)out.push("@"+st.rir+" RIR");
 return out.join(" · ");
}

/* Up next: the rotation, not the calendar. A week is complete when B, A and C all have a
   finished session in this block; the next gym day is the first one in ORDER not yet done. */
var TESTS={1:{A:"left/right screen",C:"change of direction + back-extension hold"},4:{B:"broad jump + vertical",C:"change of direction + back-extension hold"}};
function upNext(){
 var mine=DB.sessions.filter(function(s){return (s.block||2)===BLOCKNUM&&s.status==="done"&&ORDER.indexOf(s.day)>=0&&entryCount(s)>0;});
 for(var w=1;w<=NWEEKS;w++){
  var done={};mine.forEach(function(s){if(s.week===w)done[s.day]=true;});
  var nx=ORDER.filter(function(k){return !done[k];})[0];
  if(nx)return{week:w,day:nx,done:done,tests:(TESTS[w]&&TESTS[w][nx])||""};
 }
 return null;
}
function dayLabel(k){return PROGRAM[k]&&PROGRAM[k].label?PROGRAM[k].label:(PROGRAM[k]?PROGRAM[k].name:k);}

/* A slot you have already logged must never silently open blank. Tapping a
   week+day that already has a record offers that record first; a brand new
   blank session becomes a deliberate second choice. */
function sessionsForSlot(day,week){
 return DB.sessions.filter(function(s){return s.day===day&&s.week===week&&(s.block||2)===BLOCKNUM&&!isBlank(s);});
}
function entryCount(s){
 return Object.keys(s.entries||{}).filter(function(k){
  var e=s.entries[k];
  return e&&(e.done||(e.sets||[]).some(function(st){return Object.keys(st).some(function(f){return st[f]!==""&&st[f]!=null;});}));
 }).length;
}

}

/* This week's plan for one set, shown grey in the empty boxes. Nothing is stored until
   you type or tap \u2713, so an untouched row never looks like a set you did. */
function planFor(it,s,fields){
 var p={},L=loadFor(it,s.week,s.id);
 if(typeof L==="number"){LOADK.concat(["assist","ball","pin","sec"]).forEach(function(k){if(fields.indexOf(k)>=0)p[k]=L;});}
 if(it.rp){["reps","rside","rleg","distm"].forEach(function(k){if(fields.indexOf(k)>=0)p[k]=it.rp;});}
 if(it.rir&&fields.indexOf("rir")>=0){var r=it.rir[s.week-1];if(r!=null)p.rir=r;}
 return p;
}
function exCard(it,s,ro){
 var ent=s.entries[it.id]||(s.entries[it.id]={sets:[]});
 var card=el('<div class="card"></div>');
 card.appendChild(el('<div class="exn">'+esc(it.n)+'</div>'));
 var tg=targetFor(it,s.week,s.id);if(tg)card.appendChild(el('<div class="tgt">'+esc(tg)+'</div>'));
 if(it.cue||it.q){
  var tools=el('<div class="tools"></div>');
  var cueBox=null;
  if(it.cue){
   cueBox=el('<div class="cue cuebox" style="display:none">'+esc(it.cue)+'</div>');
   var nb=el('<div class="tool">ⓘ Coaching notes</div>');
   nb.onclick=function(){
    var open=cueBox.style.display==="none";
    cueBox.style.display=open?"block":"none";
    nb.classList.toggle("on",open);
    NOTEOPEN[it.id]=open;
   };
   tools.appendChild(nb);
   if(NOTEOPEN[it.id]){cueBox.style.display="block";nb.classList.add("on");}
  }
  if(it.v||it.q){
   var href=it.v?it.v:("https://www.youtube.com/results?search_query="+encodeURIComponent(it.q));
   var label=it.v?"▶ Video":"▶ Find video";
   tools.appendChild(el('<a class="tool" target="_blank" rel="noopener" href="'+href+'">'+label+'</a>'));
  }
  if(it.rest&&!ro){var rt=el('<div class="tool">\u23f1 Rest '+fmt(it.rest)+'</div>');rt.onclick=function(){tSet(it.rest);tShow();tStart();};tools.appendChild(rt);}
  card.appendChild(tools);
  if(cueBox)card.appendChild(cueBox);
 }
 if((it.f||[]).filter(function(f){return f!=="done";}).length){
  var lf=lastFor(it.id,s.id);
  if(lf)card.appendChild(el('<div class="meta">Last ('+esc(lf.sess.date)+'): <b>'+esc((lf.e.sets||[]).filter(function(st){return setStr(it,st);}).map(function(st){return setStr(it,st);}).join(" | "))+'</b></div>'));
  else card.appendChild(el('<div class="meta">Last: <b>—</b> (first time)</div>'));
 }else{
  var ld=lastDoneFor(it.id,s.id);
  card.appendChild(el('<div class="meta">Last done: <b>'+(ld?esc(ld.date):"—")+'</b></div>'));
 }

 var fields=(it.f||[]).filter(function(f){return f!=="done";});
 var wantsDone=(it.f||[]).indexOf("done")>=0;

 if(fields.length&&!ro){
  if(ent.sets.length===0){var n=it.sets||3;for(var i=0;i<n;i++)ent.sets.push({});}
  card.appendChild(el('<div class="caps">'+fields.map(function(f){return '<span>'+esc(FT[f].cap)+'</span>';}).join("")+'<span style="flex:0 0 34px"></span></div>'));
  var body=el('<div></div>');
  function drawSets(){
   body.innerHTML="";
   ent.sets.forEach(function(st,i){
    var row=el('<div class="setrow"><div class="n">'+(i+1)+'</div></div>');
    var ph=planFor(it,s,fields),inps={};
    fields.forEach(function(f){
     var inp=el('<input type="number" inputmode="decimal" step="any" placeholder="'+esc(ph[f]!=null?ph[f]:FT[f].ph)+'" value="'+esc(st[f]!==undefined?st[f]:"")+'">');
     inp.addEventListener("input",function(e){st[f]=e.target.value;s.updated=nowISO();save();updEst();});
     inps[f]=inp;row.appendChild(inp);
    });
    if(Object.keys(ph).length){
     var ok=el('<button class="okset" title="Log this set as shown">\u2713</button>');
     ok.onclick=function(){
      var any=false;fields.forEach(function(f){if((st[f]===undefined||st[f]==="")&&ph[f]!=null){st[f]=String(ph[f]);inps[f].value=st[f];any=true;}});
      if(any){s.updated=nowISO();save();updEst();ok.textContent="\u2714";}
     };
     row.appendChild(ok);

/* ---------- TIMER ----------
   Counts against a fixed end time, so locking the phone or switching apps cannot stall it:

var tLeft=120,tEnd=0,tInt=null,tCtx=null;
function fmt(s){s=Math.max(0,Math.round(s));var m=Math.floor(s/60),r=s%60;return m+":"+String(r).padStart(2,"0");}

 try{navigator.vibrate&&navigator.vibrate([300,150,300]);}catch(e){}}

/* ---------- KEYBOARD GUARD (2026-11-08) ----------
   iOS Safari moves position:fixed bars up with the on-screen keyboard and can leave them
   stuck mid-screen, covering the field being typed in. While any field has focus, both
   bars are hidden (the rest timer keeps counting underneath); the focused field is scrolled
   to the middle of the visible area; on leaving the field, a forced re-layout puts the bars
   back at the true bottom. */
(function(){
 function isField(t){return t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.tagName==="SELECT");}
 var hideT=null;
 document.addEventListener("focusin",function(e){
  if(!isField(e.target))return;
  if(hideT){clearTimeout(hideT);hideT=null;}
  document.body.classList.add("typing");
  var t=e.target;
  setTimeout(function(){try{t.scrollIntoView({block:"center",behavior:"smooth"});}catch(x){}},350);
 });
 document.addEventListener("focusout",function(e){
  if(!isField(e.target))return;
  hideT=setTimeout(function(){
   if(isField(document.activeElement))return;   /* moved to the next field: stay hidden */
   document.body.classList.remove("typing");
   window.scrollTo(window.scrollX,window.scrollY); /* forces iOS to re-place fixed bars */
  },150);
 });
 /* belt and braces: if the keyboard is closed but a bar was left floating, snap it back */
 if(window.visualViewport){
  window.visualViewport.addEventListener("resize",function(){
   var kb=window.innerHeight-window.visualViewport.height>120;
   if(!kb&&!isField(document.activeElement)){document.body.classList.remove("typing");}
  });
 }
})();
