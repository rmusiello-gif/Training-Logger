<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1F3864">
<title>Athletic Aging — Logger</title>
<style>
:root{--navy:#1F3864;--blue:#2E75B6;--bg:#0f141b;--card:#1a212c;--card2:#222b39;--line:#2f3a4a;--txt:#e8edf4;--mut:#93a1b3;--gold:#e0a800;--good:#3ea76a;--bad:#e05a4a;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;}
body{padding-bottom:90px;}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#1F3864,#16223a);padding:14px 16px 12px;padding-top:calc(14px + env(safe-area-inset-top,0));box-shadow:0 2px 10px rgba(0,0,0,.4);}
header .t{font-size:19px;font-weight:800;letter-spacing:.2px;}
header .s{font-size:12px;color:#b9c6da;margin-top:2px;}
.wrap{padding:14px 14px 20px;max-width:640px;margin:0 auto;}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:700;color:#fff;background:var(--blue);margin:10px 0;text-align:center;cursor:pointer;}
.btn.sec{background:var(--card2);border:1px solid var(--line);}
.btn.gold{background:var(--gold);color:#20180a;}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt);}
.btn.sm{padding:11px;font-size:14px;}
.pick{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px;}
.chip{flex:1;min-width:56px;text-align:center;padding:14px 6px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:15px;color:var(--txt);cursor:pointer;}
.chip.on{background:var(--blue);border-color:var(--blue);}
.lbl{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin:16px 2px 4px;}
.sec-h{font-size:12px;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:1px;margin:18px 4px 6px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;}
.exn{font-size:16px;font-weight:800;}
.tgt{font-size:12.5px;color:var(--blue);font-weight:700;margin-top:2px;}
.cue{font-size:12.5px;color:#c3cfdd;margin-top:8px;line-height:1.6;background:#141b25;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:9px;padding:10px 11px;}
.tools{display:flex;gap:7px;margin-top:9px;}
.tool{flex:1;text-align:center;font-size:12px;font-weight:700;padding:9px 6px;border-radius:9px;background:var(--card2);border:1px solid var(--line);color:var(--txt);text-decoration:none;cursor:pointer;display:block;}
.tool.on{background:var(--blue);border-color:var(--blue);color:#fff;}
.meta{font-size:12px;color:var(--mut);margin-top:5px;line-height:1.5;}
.meta b{color:var(--txt);}
.setrow{display:flex;align-items:center;gap:7px;margin-top:8px;}
.setrow .n{width:20px;color:var(--mut);font-size:13px;font-weight:700;text-align:center;}
.setrow input{flex:1;min-width:0;background:#0e141d;border:1px solid var(--line);border-radius:10px;color:#fff;font-size:16px;padding:11px 6px;text-align:center;-moz-appearance:textfield;}
.setrow input::-webkit-outer-spin-button,.setrow input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.caps{display:flex;gap:7px;margin:6px 0 0 27px;}
.caps span{flex:1;text-align:center;font-size:9.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;}
.addset{background:transparent;border:1px dashed var(--line);color:var(--mut);border-radius:10px;padding:8px;width:100%;margin-top:8px;font-size:13px;cursor:pointer;}
.delset{flex:0 0 34px;width:34px;background:transparent;border:1px solid var(--line);color:var(--mut);border-radius:10px;font-size:19px;line-height:1;padding:9px 0;cursor:pointer;font-family:inherit;}
.delset:active{background:var(--bad);border-color:var(--bad);color:#fff;}
.done{display:flex;align-items:center;gap:10px;margin-top:8px;}
.done input{width:26px;height:26px;}
textarea{width:100%;background:#0e141d;border:1px solid var(--line);border-radius:10px;color:#fff;font-size:15px;padding:10px;margin-top:6px;font-family:inherit;}
.est{font-size:12px;color:var(--good);font-weight:700;margin-top:6px;}
.tabbar{position:fixed;bottom:0;left:0;right:0;display:flex;background:#121924;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0);z-index:30;}
.tabbar button{flex:1;background:none;border:0;color:var(--mut);font-size:11px;padding:10px 4px;font-weight:700;cursor:pointer;}
.tabbar button.on{color:var(--blue);}
.tabbar .ic{font-size:19px;display:block;}
.hist{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;cursor:pointer;}
.hist.open{border-color:var(--gold);}
.hist .d{font-weight:800;}
.hist .m{font-size:12px;color:var(--mut);margin-top:3px;}
.badge{display:inline-block;font-size:10px;font-weight:800;padding:2px 7px;border-radius:20px;background:var(--gold);color:#20180a;margin-left:6px;vertical-align:1px;}
.timerbar{position:fixed;left:0;right:0;bottom:64px;background:#141c28;border-top:1px solid var(--line);padding:8px 12px;display:none;align-items:center;gap:10px;z-index:25;}
.timerbar.on{display:flex;}
.timerbar .tm{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;min-width:64px;}
.timerbar button{background:var(--card2);border:1px solid var(--line);color:#fff;border-radius:9px;padding:8px 12px;font-weight:700;font-size:13px;}
.note{font-size:12px;color:var(--mut);background:rgba(224,168,0,.08);border:1px solid rgba(224,168,0,.35);border-radius:10px;padding:10px;margin:10px 0;line-height:1.5;}
.warn{font-size:12.5px;color:#ffd9d3;background:rgba(224,90,74,.12);border:1px solid rgba(224,90,74,.5);border-radius:10px;padding:10px;margin:10px 0;line-height:1.5;}
.ok{font-size:12px;color:#cfe9da;background:rgba(62,167,106,.10);border:1px solid rgba(62,167,106,.4);border-radius:10px;padding:10px;margin:10px 0;line-height:1.5;}
h2.scr{font-size:20px;margin:6px 2px 2px;}
.mut{color:var(--mut);font-size:13px;line-height:1.55;}
.savedot{font-size:11px;color:var(--good);margin-top:3px;}
#updbar{position:fixed;left:0;right:0;top:0;z-index:60;background:var(--gold);color:#20180a;font-weight:800;font-size:14px;padding:14px;text-align:center;display:none;cursor:pointer;}
#updbar.on{display:block;}
</style>
</head>
<body>
<header><div class="t" id="hdrT">Athletic Aging — Logger</div><div class="s" id="hdrS">Block 2 · tap Log to begin</div><div class="savedot" id="buildTag" style="color:#93a1b3"></div><div class="savedot" id="saveDot"></div></header>
<div id="updbar" onclick="doUpdate()">A newer version is available — tap here to load it</div>
<div class="wrap" id="app"></div>

<div class="timerbar" id="tbar"><div class="tm" id="tm">2:00</div><button onclick="tAdj(-15)">−15</button><button onclick="tAdj(15)">+15</button><button onclick="tToggle()" id="tBtn">Start</button><button onclick="tHide()">✕</button></div>

<div class="tabbar">
<button id="tab-log" class="on" onclick="go('log')"><span class="ic">➕</span>Log</button>
<button id="tab-hist" onclick="go('hist')"><span class="ic">📖</span>History</button>
<button id="tab-data" onclick="go('data')"><span class="ic">📤</span>Send</button>
<button id="tab-info" onclick="go('info')"><span class="ic">ℹ️</span>Guide</button>
</div>

<script>
"use strict";
var BUILD="2026-09-21";

/* =========================================================
   FIELD TYPES — every input is explicitly declared per exercise.
   No exercise ever gets a box that does not belong to it.
   ========================================================= */
var FT={
 load  :{cap:"Load lb",   ph:"lb"},
 loadh :{cap:"Load /hand",ph:"lb/hand"},
 assist:{cap:"Assist lb", ph:"assist"},
 ball  :{cap:"Ball lb",   ph:"ball"},
 pin   :{cap:"Stack/pin", ph:"pin"},
 reps  :{cap:"Reps",      ph:"reps"},
 rside :{cap:"Reps /side",ph:"/side"},
 rleg  :{cap:"Reps /leg", ph:"/leg"},
 rir   :{cap:"RIR",       ph:"rir"},
 distm :{cap:"Distance m",ph:"metres"},
 distin:{cap:"Distance in",ph:"inches"},
 hgtin :{cap:"Height in", ph:"inches"},
 sec   :{cap:"Seconds",   ph:"sec"},
 min   :{cap:"Minutes",   ph:"min"},
 hr    :{cap:"Avg HR",    ph:"bpm"},
 rpe   :{cap:"RPE",       ph:"rpe"},
 watts :{cap:"Avg watts", ph:"watts"},
 rounds:{cap:"Rounds",    ph:"rounds"},
 ivals :{cap:"Intervals", ph:"how many"}
};
/* field keys that mean "a load" for est-1RM purposes */
var LOADK=["load","loadh"];

/* =========================================================
   PROGRAM — Block 3 v1
   f: array of field keys. wk: load hint per week [W1..W5].
   ========================================================= */
var BLOCK="Block 3";
var NWEEKS=4;
var WEEKTIP={
 1:"W1 — RE-ENTRY + ALL FOUR TESTS. Loads ~90% of Block 2’s top. Front squat and trap bar run at 3 RIR this week only. Tests: broad jump + vertical (Day A) · CoD (any day, REVISED protocol) · Biering-Sørensen LAST on Day C. Log one rep of every mobility and agility item. WEEK: Mon tennis · Tue Day B · Wed tennis · Thu Day A · Fri OPTIONAL · Sat Day C · Sun rest.",
 2:"W2 — BUILD. First real working loads. THE RIR RULE STARTS: one lift a day at 1–2 RIR, everything else at 3. Reactive element enters the Day C agility circuit. Sand primer live before Mon/Wed tennis.",
 3:"W3 — PEAK. Hardest week. Top loads, lowest RIR — on the PRIMARY lift only. Agility ~85–90%, never max. Your hardest week follows your easiest, not your previous-hardest.",
 4:"W4 — DELOAD + RETEST. ~60–65% loads, about half the sets. RETEST ALL FOUR NUMBERS with the identical protocols from W1 — same app, same surface, same shoes, same convention. This retest is the payoff of the whole block; Block 2 never reached its own and lost five weeks of data."
};
var LOADRULE="LOAD RULE — beat the top of the rep range by 2+ → add ~5% next time. Miss the bottom by 2+ → drop ~10%. Inside the range at target RIR → repeat the load. The rep range is the instruction; the load is what you move.";
var RIRRULE="RIR RULE — the day’s FIRST strength lift goes to 1–2 RIR. Everything else lives at 3 RIR. WEEK 1 IS THE EXCEPTION: the front squat and trap bar run at 3 RIR while you re-find the patterns. The rule starts in week 2. Ten exercises at 1–2 RIR is what fries a block.";
var PAIRRULE="PAIR RULE (v2.4) — anything labelled A1/A2, B1/B2, C1/C2 is a SUPERSET: A1 → 30–45 sec → A2 → 60–75 sec → back to A1, three rounds. Never pair the jumps, the med-ball throw, the deceleration block, the front squat or the trap bar — those take full rest.";

var PROGRAM={
 A:{name:"Day A — Lower: Power + Squat",label:"Day A",short:"Lower: power + squat · ~62 min",items:[
  {s:"Prep",q:"ankle knee to wall and 90/90 hip mobility warm up",id:"a_prep",n:"Warm-up + ankle & hip mobility",f:["done"],tg:"10 min",cue:"Bike 3–4 min · ankle knee-to-wall 10/side · 90/90 hip switches · couch stretch 30 s/side · deep squat hold 30 s · heel-raised BIG-TOE ISOMETRIC 2 × 20 s · two bodyweight squat sets."},
  {s:"Prep",q:"tennis split step drill react first step",id:"a_split",n:"Split step → react ★ NEW",f:["rounds","done"],sets:1,tg:"3 min · 8–10 reps",cue:"THE MISSING LINK, and you asked for it. Small hop to a balanced athletic landing on the balls of the feet, then break on a cue — vary the direction, use a partner or a random phone beep where you can. This is the ready position every reaction in the game starts from and it was not in the program at all. Technique speed, fresh, un-sedated."},
  {s:"Power / Test — full rest, never paired",q:"trap bar jump squat technique",id:"a_tbjump",n:"Trap-bar jump",f:["load","reps"],sets:3,tg:"3 × 3 · {L} lb TOTAL",wk:[95,100,105,85,""],cue:"Explode, reset every rep, stop the set the moment speed drops. Never grind a jump. Bilateral vertical power is the most sport-specific thing in this session — sand is soft and gives nothing back."},
  {s:"Power / Test — full rest, never paired",q:"standing broad jump test technique",id:"a_broad",n:"Broad jump (TEST WEEKS ONLY)",f:["distin"],sets:3,tg:"W1 & W4 ONLY · 3 max attempts",cue:"PROTOCOL PINNED. Fully warmed up. 3 max attempts, stick the landing, measure TOE TO TOE from the line, log the best. Your reference is 93 in from 2026-08-17 measured the same way. The submaximal 3 × 3 version is gone — it produced numbers nobody could interpret."},
  {s:"Power / Test — full rest, never paired",q:"vertical jump countermovement test",id:"a_vert",n:"Vertical jump (TEST WEEKS ONLY)",f:["hgtin"],sets:1,tg:"W1 & W4 ONLY · 3 attempts",cue:"SAME APP, same phone, same surface, same shoes, same time of day. Absolute agreement between methods is only 0.665 — switching instruments would fabricate a result bigger than any real four-week change. Write the app name in the session note. Reference: 20 in / 51 cm."},
  {s:"Power / Test — full rest, never paired",q:"deceleration landing drill lateral bound stick",id:"a_decel",n:"Deceleration & landing block",f:["rounds","done"],sets:1,tg:"7 min",cue:"Snapdown to stick 3 × 4 · lateral bound to stick 3 × 3/side · LATERAL HURDLE HOP → SINGLE-LEG STICK 2 × 3/side (NEW, unloaded all block) · drop-step retreat → accelerate 3 × 4. STOPPING RULE IS NOISE: if landings get loud or you cannot hold the stick 2 seconds, the set is finished."},
  {s:"Strength — full rest · the 1–2 RIR lift",q:"front squat form cues",id:"a_fsq",n:"Front squat",f:["load","reps","rir"],sets:4,tg:"4 × 5 · {L} lb",wk:[140,152,162,115,""],cue:"THE ONE LIFT ON DAY A THAT GOES NEAR FAILURE. Deep, chest tall, cross-arm grip. W1 runs at 3 RIR while you re-find the pattern, then 1–2 RIR from W2. Block 2 took you 120 → 155 at a settled 2 RIR — an estimated 1RM near 188, roughly +9% on the block."},
  {s:"Pair A1 + A2 — superset",q:"bulgarian split squat dumbbell one hand balance",id:"a_bss",n:"A1 — Bulgarian split squat (DB one hand + stick)",f:["load","rleg","rir"],sets:3,tg:"3 × 8 → 3 × 6 /leg · {L} lb ONE DUMBBELL",wk:[50,60,70,40,""],cue:"YOUR VERSION, and it is the better one. Dumbbell in the hand OPPOSITE the working front leg — same side every time so loads stay comparable. Other hand on a stick or rack upright. THE STICK IS BALANCE, NOT ASSISTANCE: fingertip contact. If you are pulling on it the load number is lying. Contralateral loading also adds frontal-plane trunk work for free."},
  {s:"Pair A1 + A2 — superset",q:"seated leg curl machine form",id:"a_ham",n:"A2 — SEATED leg curl (seated only)",f:["load","reps","rir"],sets:3,tg:"3 × 10–12 · {L} lb",wk:["FIND","+5%","+5%","-35%",""],cue:"SEATED, AND ONLY SEATED — pick one machine and stay on it. Hip flexed to 90° holds the hamstring at long muscle length the whole way; Maeo 2021 found substantially more growth seated than lying. It also matches how the hamstring works decelerating on sand. Your Block 2 loads came off whichever machine was free, so W1 finds the number."},
  {s:"Pair B1 + B2 — superset",q:"seated calf raise soleus",id:"a_scr",n:"B1 — Seated (bent-knee) calf raise",f:["load","reps","rir"],sets:3,tg:"3 × 12 · {L} lb",wk:[55,60,65,45,""],cue:"SOLEUS. 55 and 60 are your real numbers — the 150/190/210 in the Block 2 log were standing calf raises entered in this slot, which means the soleus got no direct work until week 3. Two-second pause at the bottom stretch, full range."},
  {s:"Pair B1 + B2 — superset",q:"pallof press anti rotation core",id:"a_pallof",n:"B2 — Pallof press · 3-sec pause",f:["pin","rside"],sets:3,tg:"3 × 10 /side · log the pin",wk:["log","+1","+1","W1",""],cue:"MOVE THE PIN. It sat at 15 for four straight weeks while the load rule went unapplied. Exhale through every rep, no breath holding until the stress test is done."}
 ]},

 B:{name:"Day B — Upper: Push / Pull",label:"Day B",short:"Upper, shoulder-safe · ~63 min",items:[
  {s:"Prep",q:"shoulder warm up band pull apart face pull scapular",id:"b_prep",n:"Shoulder prep + face pulls + T-spine & lat mobility",f:["done"],tg:"11 min",cue:"Shoulder CARs · band pull-aparts · scap work · face pull 2 × 15. Then the screen-targeted work: bench lat stretch 3 × 30 s · thoracic extension over a roller 8–10 · doorway pec stretch 2 × 30 s/side · prone Y-raise 2 × 10. Shoulder flexion + T-spine extension + lat length is the exact trio that failed at squat depth on your film."},
  {s:"Power — full rest, never paired",q:"rotational medicine ball throw wall",id:"b_mb",n:"Rotational med-ball throw (wall)",f:["ball","rside"],sets:3,tg:"3 × 4 /side · {L} lb ball",wk:[8,8,10,8,""],cue:"Fast hips, not arm. Confirmed max intent — keep it there. The one power movement that transfers directly to your swing. Ball goes to 10 lb in W3 only if W2 is still visibly fast."},
  {s:"Strength — full rest · the 1–2 RIR lift",q:"dumbbell bench press form",id:"b_bench",n:"DB bench press (regular grip)",f:["loadh","reps","rir"],sets:4,tg:"4 × 6 · {L} lb PER HAND",wk:[52.5,57.5,60,45,""],cue:"PER HAND. Regular grip is your call and four weeks of symptom-free pressing is real evidence — but keep a MODERATE ELBOW TUCK around 45°, not flared to 90°, and DO NOT let the dumbbells sink below chest level into deep extension. That end-range position is where the anterior shoulder stress lives, not the grip. If the discomfort in that arm recurs, this is suspect number one."},
  {s:"Pair A1 + A2 — superset",q:"assisted pull up machine form",id:"b_pull",n:"A1 — Assisted pull-up",f:["assist","reps","rir"],sets:4,tg:"4 × 6 · {L} lb ASSIST",wk:[55,50,47.5,60,""],cue:"TARGET RESET. Unassisted by the end of Block 3 needed roughly +13% in one block and was never realistic — repeating an unreachable target is not a plan. The new target is the assist number: 55 → 47.5 by W3, under 40 by the end of Block 4. W4 add three bodyweight negatives with a five-second lowering."},
  {s:"Pair A1 + A2 — superset",q:"two handed landmine press standing",id:"b_lm",n:"A2 — Landmine press, TWO-HANDED",f:["load","reps","rir"],sets:3,tg:"3 × 8–10 · {L} lb TOTAL on the bar",wk:["FIND","+5%","+5%","-30%",""],cue:"NOW TWO-HANDED — both hands cupping the end of the bar, press from the chest up and forward. Same angled labrum-safe path, half the executions. Start W1 around your Block 2 single-arm load of 90 and apply the load rule aggressively: two hands should move more than one. Ribs down, do not overarch, never press straight overhead."},
  {s:"Pair B1 + B2 — superset",q:"chest supported t bar row neutral grip",id:"b_row",n:"B1 — Chest-supported T-bar row",f:["load","reps","rir"],sets:3,tg:"3 × 10 · {L} lb TOTAL",wk:[55,60,65,45,""],cue:"Neutral / parallel handle only — elbow rule. Straps if grip fades first. Your W4 sat at 55 after you had hit 65 because you were protecting your upper back that session; that tweak resolved, so start at 55 and let the load rule take you back past 65."},
  {s:"Pair B1 + B2 — superset",q:"incline dumbbell press form",id:"b_inc",n:"B2 — Incline DB press",f:["loadh","reps","rir"],sets:2,tg:"2 × 12 · {L} lb PER HAND",wk:[45,47.5,50,40,""],cue:"PER HAND. Same end-range rule as the flat bench — do not sink into deep extension at the bottom."},
  {s:"Pair C1 + C2 — superset",q:"hammer curl neutral grip",id:"b_hammer",n:"C1 — Hammer curl (neutral)",f:["loadh","reps","rir"],sets:2,tg:"2 × 12 · {L} lb PER HAND",wk:[27.5,30,30,25,""],cue:"PER HAND. It sat at 25 for four straight weeks while the reps climbed past the range — that is the load rule going unapplied. Neutral, and it stays neutral."},
  {s:"Pair C1 + C2 — superset",q:"overhead dumbbell triceps extension",id:"b_ohtri",n:"C2 — Overhead DB triceps extension",f:["load","reps","rir"],sets:2,tg:"2 × 12 · {L} lb TOTAL",wk:[45,50,50,35,""],cue:"TOTAL load on one dumbbell held in both hands. Take these to 3 RIR."},
  {s:"Carry",q:"farmers carry both hands grip",id:"b_carry",n:"Farmer's carry — BILATERAL",f:["loadh","distm"],sets:2,tg:"2 × 40 m · {L} lb PER HAND",wk:[60,65,70,55,""],cue:"NOW BILATERAL — both hands, no straps. The grip is the point and it maps straight to the Decathlon target of carrying your own luggage. LOG LOAD AND DISTANCE, there are no reps. Anti-lateral-flexion now comes free from the contralateral Bulgarian, so the suitcase version is retired. 70 lb per hand is a ceiling, not an obligation."},
  {s:"Aerobic",q:"zone 2 cycling power watts training",id:"b_z2",n:"Zone 2 bike — after the session",f:["min","watts","hr"],sets:1,tg:"W1–2 30 · W3 35 · W4 25 min",cue:"RUN THIS ON WATTS, NOT HEART RATE. Minoxidil raised your resting HR by about 4.5 bpm, so the old HR ceiling under-doses you. W1: find the wattage you can hold for 30 min while nose-breathing and speaking full sentences — that number is your Zone 2 and it is drug-invariant. Then hold it and watch HR DRIFT DOWN at the same watts over the block. That is the real aerobic signal."}
 ]},

 C:{name:"Day C — Hinge, Agility, Trunk",label:"Day C",short:"Hinge + agility + trunk · ~64 min",items:[
  {s:"Prep / Agility",q:"full body dynamic warm up",id:"c_prep",n:"Full-body warm-up",f:["done"],tg:"8 min",cue:"Morning session, fully un-sedated. Everything here is technique speed."},
  {s:"Prep / Agility",q:"agility footwork drop step crossover shuffle",id:"c_agil",n:"Agility pattern circuit — 3 ROUNDS",f:["rounds","done"],sets:1,tg:"3 rounds · 12–15 min",cue:"THREE ROUNDS. NOT ONE. Across Block 2 this logged 1, 3, 0 and 1 against three prescribed — the most under-delivered item in the program, and it targets your one self-identified weak spot. Each round: split step → drop-step → retreat 5 m → plant → sprint 5 m forward, 4 reps alternating · crossover step 6 m each way × 2 · lateral shuffle 8 m each way × 2 · pogo hops × 20. W2–3 ONLY: on 4 of the drop-step reps do not decide the direction in advance — random phone beep or a coin flip."},
  {s:"Power — full rest, never paired",q:"pogo hops jump rope stiffness",id:"c_pogo",n:"Pogo hops / jump rope",f:["reps"],sets:3,tg:"3 × 20 · bodyweight",cue:"Gastrocnemius and Achilles stiffness — what lets you change direction on unstable sand. Land tall, quiet, springy. BILATERAL by design: you told the board two-leg jumping is what the game actually demands."},
  {s:"Strength — full rest · the 1–2 RIR lift",q:"trap bar deadlift form",id:"c_tbdl",n:"Trap-bar deadlift",f:["load","reps","rir"],sets:4,tg:"4 × 5 (W3: 4 × 4) · {L} lb",wk:[240,265,280,200,""],cue:"THE ONE LIFT ON DAY C THAT GOES NEAR FAILURE. 215 → 265 across Block 2, estimated 1RM near 322, roughly +5%. You also applied the load rule correctly to yourself at W2 — dropped 260 to 255 when reps fell off and got more reps. That is the rule working. Flat back, stand tall, control the lower, straps on the top sets."},
  {s:"Pair A1 + A2 — superset",q:"dumbbell step up box",id:"c_lunge",n:"A1 — Step-up (20 in box)",f:["loadh","rleg","rir"],sets:3,tg:"3 × 8 /leg · {L} lb PER HAND",wk:[45,50,55,35,""],cue:"PER HAND. Stays unilateral because nothing bilateral delivers the same thing, and it maps to a Decathlon target. Drive through the whole foot, control the step down."},
  {s:"Pair A1 + A2 — superset",q:"dumbbell floor press neutral grip",id:"c_push",n:"A2 — DB floor press (neutral)",f:["loadh","reps","rir"],sets:3,tg:"3 × 10 · {L} lb PER HAND",wk:[47.5,50,52.5,40,""],cue:"PER HAND. Neutral grip, and the floor limits end range for you — that is the point. Pause lightly at the floor, do not bounce."},

/* =========================================================
   STORAGE — v2. Every session lives in ONE array from the
   moment it starts. Nothing depends on remembering to press
   Finish. Mirrored to a second key on every write.
   ========================================================= */
var KEY="aa_logger_v2", MIRROR="aa_logger_v2_mirror", SALVAGE="aa_logger_v2_salvage", OLDKEY="aa_logger_v1";
var booted=false;
var DB={sessions:[],lastExport:null,ver:2};
var view="log", storageOK=true;

function nowISO(){return new Date().toISOString();}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function uid(){return "s"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

function readKey(k){try{var raw=localStorage.getItem(k);return raw?JSON.parse(raw):null;}catch(e){return null;}}

function boot(){
 var cands=[readKey(KEY),readKey(MIRROR),readKey(SALVAGE)].filter(function(x){return x&&x.sessions;});
 // whichever copy holds the most sessions wins — a half-written or emptied
 // key can never beat a good one
 cands.sort(function(x,y){return (y.sessions||[]).length-(x.sessions||[]).length;});
 if(cands.length)DB=cands[0];
 // migrate Block 1 data if we have nothing yet (runs even if an empty v2 store exists)
 if(!DB.sessions||!DB.sessions.length){
  var old=readKey(OLDKEY);
  if(old){
   DB.sessions=(old.sessions||[]).map(function(s){s.status="done";s.block=1;s.id=s.id||uid();return s;});
   // RECOVER an unfinished draft — this is exactly what was being lost before
   if(old.draft&&old.draft.entries&&Object.keys(old.draft.entries).length){
    var d=old.draft;d.status="open";d.block=1;d.id=uid();d.recovered=true;DB.sessions.push(d);
   }
  }
 }
 if(!DB.sessions)DB.sessions=[];
 DB.ver=2;
 booted=true;
 autoCloseStale();
 save();
}
/* Writing is guarded. A save can never silently replace a bigger store with a
   smaller one: any shrink is stashed to a salvage key first, and a save that
   would wipe the store back to zero is refused outright. */
function save(allowShrink){
 if(!booted)return;
 DB.updated=nowISO();
 var payload=JSON.stringify(DB);
 try{
  var prev=readKey(KEY);
  var prevN=prev&&prev.sessions?prev.sessions.length:0, curN=(DB.sessions||[]).length;
  if(prevN>curN){
   if(curN===0&&!allowShrink){            // pathological — refuse and reload the good copy
    DB=prev;storageOK=true;flashSaved();return;
   }
   try{localStorage.setItem(SALVAGE,JSON.stringify(prev));}catch(e2){}
   payload=JSON.stringify(DB);
  }
  localStorage.setItem(KEY,payload);
  localStorage.setItem(MIRROR,payload);
  storageOK=true;
 }catch(e){storageOK=false;}
 flashSaved();
}
var saveT=null;
function flashSaved(){
 var el=document.getElementById("saveDot");if(!el)return;
 if(!storageOK){el.style.color="var(--bad)";el.textContent="⚠︎ Could not save to this device — export now.";return;}
 el.style.color="var(--good)";
 el.textContent="✓ saved "+new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
 clearTimeout(saveT);saveT=setTimeout(function(){el.textContent="";},4000);
}
/* Any session left open for more than 18 hours is closed automatically.
   A forgotten session can no longer disappear from History or the export. */
function autoCloseStale(){
 var cut=Date.now()-18*3600*1000, changed=false;
 DB.sessions.forEach(function(s){
  if(s.status==="open"){
   var t=Date.parse(s.updated||s.started||"")||0;
   if(t&&t<cut){s.status="done";s.autoClosed=true;changed=true;}
  }
 });
 return changed;
}
function hasData(s){
 return Object.keys(s.entries||{}).some(function(k){
  var e=s.entries[k];if(!e)return false;
  if(e.done||e.txt)return true;
  return (e.sets||[]).some(function(st){return Object.keys(st).some(function(f){return st[f]!==""&&st[f]!=null;});});
 });
}
function openSessions(){return DB.sessions.filter(function(s){return s.status==="open";});}
function daysSinceExport(){if(!DB.lastExport)return null;return Math.floor((Date.now()-Date.parse(DB.lastExport))/86400000);}

/* ---------- HELPERS ---------- */
function el(h){var d=document.createElement("div");d.innerHTML=h;return d.firstElementChild;}
function esc(s){return(s==null?"":String(s)).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function e1rm(w,r){w=parseFloat(w);r=parseFloat(r);if(!w||!r)return null;return Math.round(w*(1+r/30));}
function stamp(s){return s.started||((s.date||"")+"T00:00:00.000Z");}
function lastFor(id,exceptId){
 var cur=DB.sessions.filter(function(x){return x.id===exceptId;})[0];
 var curT=cur?stamp(cur):"";
 for(var i=DB.sessions.length-1;i>=0;i--){
  var s=DB.sessions[i];if(s.id===exceptId)continue;
  if(curT&&stamp(s)>curT)continue;   // editing an old session must not quote a newer one
  var e=s.entries&&s.entries[id];
  if(e&&(e.sets||[]).some(function(st){return Object.keys(st).some(function(f){return st[f]!==""&&st[f]!=null;});}))return{sess:s,e:e};
 }
 return null;
}
function lastDoneFor(id,exceptId){
 var cur=DB.sessions.filter(function(x){return x.id===exceptId;})[0];
 var curT=cur?stamp(cur):"";
 for(var i=DB.sessions.length-1;i>=0;i--){
  var s=DB.sessions[i];if(s.id===exceptId)continue;
  if(curT&&stamp(s)>curT)continue;
  var e=s.entries&&s.entries[id];
  if(e&&(e.done||e.txt))return s;
 }
 return null;
}

var CSVCOLS=["date","block","week","day","session_status","exercise","set","load_lb","load_per_hand_lb","assist_lb","ball_lb","stack_pin","reps","reps_per_side","reps_per_leg","rir","distance_m","distance_in","height_in","seconds","minutes","avg_hr","avg_watts","rpe","intervals","rounds","done","light_headed","arm_discomfort","note"];
var COLMAP={load:"load_lb",loadh:"load_per_hand_lb",assist:"assist_lb",ball:"ball_lb",pin:"stack_pin",reps:"reps",rside:"reps_per_side",rleg:"reps_per_leg",rir:"rir",distm:"distance_m",distin:"distance_in",hgtin:"height_in",sec:"seconds",min:"minutes",hr:"avg_hr",watts:"avg_watts",rpe:"rpe",ivals:"intervals",rounds:"rounds"};
function buildCSV(){
 var rows=[CSVCOLS.slice()];
 DB.sessions.forEach(function(s){
  var ids=Object.keys(s.entries||{});
  ids.forEach(function(id){
   var it=itemById(s.day,id),e=s.entries[id];
   (e.sets||[]).forEach(function(st,i){
    if(!Object.keys(st).some(function(f){return st[f]!==""&&st[f]!=null;}))return;
    var r={};CSVCOLS.forEach(function(c){r[c]="";});
    r.date=s.date;r.block=s.block||2;r.week=s.week;r.day=s.day;r.session_status=s.status;r.exercise=it.n;r.set=i+1;r.light_headed=s.dizzy?"yes":"";r.arm_discomfort=s.arm?(s.armNote||"yes"):"";
    (it.f||[]).forEach(function(f){if(COLMAP[f]&&st[f]!==""&&st[f]!=null)r[COLMAP[f]]=st[f];});
    rows.push(CSVCOLS.map(function(c){return r[c];}));
   });
   if(e.done||e.txt){
    var r2={};CSVCOLS.forEach(function(c){r2[c]="";});
    r2.date=s.date;r2.block=s.block||2;r2.week=s.week;r2.day=s.day;r2.session_status=s.status;r2.exercise=it.n;r2.done=e.done?"yes":"";r2.note=e.txt||"";r2.light_headed=s.dizzy?"yes":"";r2.arm_discomfort=s.arm?(s.armNote||"yes"):"";
    rows.push(CSVCOLS.map(function(c){return r2[c];}));
   }
  });
  if(s.note){
   var r3={};CSVCOLS.forEach(function(c){r3[c]="";});
   r3.date=s.date;r3.block=s.block||2;r3.week=s.week;r3.day=s.day;r3.session_status=s.status;r3.exercise="SESSION NOTE";r3.note=s.note;r3.light_headed=s.dizzy?"yes":"";r3.arm_discomfort=s.arm?(s.armNote||"yes"):"";
   rows.push(CSVCOLS.map(function(c){return r3[c];}));
  }
 });
 return rows.map(function(r){return r.map(function(c){c=(c==null?"":String(c));return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(",");}).join("\n");
}
function buildText(){
 if(!DB.sessions.length)return "No sessions logged yet.";
 var out=["ATHLETIC AGING — TRAINING LOG EXPORT","Generated "+today()+" · "+DB.sessions.length+" sessions",""];
 DB.sessions.forEach(function(s){
  out.push("=== "+s.date+" · "+dayLabel(s.day)+" · Week "+s.week+(s.block===1?" · BLOCK 1":"")+(s.status==="open"?" · IN PROGRESS":"")+(s.autoClosed?" · auto-closed":"")+" ===");
  Object.keys(s.entries||{}).forEach(function(id){
   var it=itemById(s.day,id),e=s.entries[id],parts=[];
   (e.sets||[]).forEach(function(st){var t=setStr(it,st);if(t)parts.push(t);});
   if(e.done)parts.push("done"+(e.txt?" ("+e.txt+")":""));
   else if(e.txt)parts.push("("+e.txt+")");
   if(parts.length)out.push("  "+it.n+": "+parts.join(" | "));
  });
  if(s.dizzy)out.push("  ** LIGHT-HEADEDNESS REPORTED **");
  if(s.note)out.push("  NOTE: "+s.note);
  out.push("");
 });
 return out.join("\n");
}

/* Sharing: the iPhone share sheet first (works inside a home-screen app,
   where a plain download link silently fails), then download, then plain text. */
function sendFile(name,text,mime){
 markExported();
 try{
  var file=new File([text],name,{type:mime});
  if(navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){
   navigator.share({files:[file],title:name}).catch(function(){fallbackSend(name,text,mime);});
   return;
  }
 }catch(e){}
 fallbackSend(name,text,mime);
}
function fallbackSend(name,text,mime){
 try{
  var b=new Blob([text],{type:mime}),u=URL.createObjectURL(b);
  var a=document.createElement("a");a.href=u;a.download=name;a.rel="noopener";
  document.body.appendChild(a);a.click();
  setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(u);},400);
  setTimeout(function(){
   if(confirm("If nothing downloaded, tap OK to show the data as text so you can copy it."))showText(text);
  },900);
 }catch(e){showText(text);}
}

function tAdj(d){tLeft=Math.max(0,tLeft+d);document.getElementById("tm").textContent=fmt(tLeft);}
function tToggle(){if(tInt)tStop();else tStart();}
function tStart(){document.getElementById("tBtn").textContent="Pause";tInt=setInterval(function(){tLeft--;if(tLeft<=0){tLeft=0;tStop();try{navigator.vibrate&&navigator.vibrate(400);}catch(e){}}document.getElementById("tm").textContent=fmt(tLeft);},1000);}
function tStop(){if(tInt){clearInterval(tInt);tInt=null;}document.getElementById("tBtn").textContent="Start";if(tLeft<=0)tLeft=120;}

/* save again whenever the app is backgrounded — iOS kills tabs aggressively */
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden")save();});
window.addEventListener("pagehide",save);

function doUpdate(){
 var base=location.href.split("?")[0].split("#")[0];
 location.replace(base+"?v="+Date.now());
}
/* Check GitHub for a newer build. iOS caches home-screen web apps hard, so
   without this an update can sit unseen for days. Fails silently offline. */
function checkUpdate(){
 try{
  var base=location.href.split("?")[0].split("#")[0];
  fetch(base+"?_cb="+Date.now(),{cache:"no-store"}).then(function(r){return r.text();}).then(function(t){
   var m=t.match(/var BUILD="([^"]+)"/);
   if(m&&m[1]!==BUILD)document.getElementById("updbar").classList.add("on");
  }).catch(function(){});
 }catch(e){}
}
boot();
render();
var bt=document.getElementById("buildTag");if(bt)bt.textContent="build "+BUILD;
setTimeout(checkUpdate,1200);
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")checkUpdate();});
</script>
